name: CI

on:
  push:
    branches: [ v2, main ]
  pull_request:
    branches: [ v2, main ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Development tools have a newer baseline than the published runtime.
        node-version: [22.13.0, 22.x, 24.x]

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --engine-strict

    - name: Build
      run: npm run build

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run typecheck

    - name: Type contract tests
      run: npm run test:types

    - name: Run tests
      run: npm test

    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Examples type check
      run: npm run examples:typecheck

    - name: Examples run
      run: npm run examples:run

    - name: Install website dependencies
      if: matrix.node-version == '24.x'
      working-directory: website
      run: npm ci --engine-strict

    - name: Website build
      if: matrix.node-version == '24.x'
      working-directory: website
      run: npm run build

    - name: Install Playwright Chromium
      if: matrix.node-version == '24.x'
      working-directory: website
      run: npx playwright install --with-deps chromium

    - name: Website accessibility smoke
      if: matrix.node-version == '24.x'
      working-directory: website
      run: npm run test:a11y

    - name: ESM/CJS interop
      run: npm run test:interop

    - name: Version smoke
      run: npm run test:version

    - name: Production dependency audit
      run: npm run test:audit

    - name: Pack dry run
      run: npm pack --dry-run

  release-boundary:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --engine-strict

    - name: Build
      run: npm run build

    - name: Documentation links
      run: npm run docs:linkcheck

    - name: Performance documentation snapshot
      run: npm run docs:performance-check

    - name: Packed consumer and optional-peer matrix
      run: npm run test:package

    - name: Full dependency audit
      run: npm run test:audit:all

    - name: Performance regression smoke
      run: npm run bench:guard:smoke

    - name: Pack the shared runtime candidate
      run: |
        mkdir -p .tmp/runtime-package
        npm pack --ignore-scripts --pack-destination .tmp/runtime-package

    - uses: actions/upload-artifact@v7
      with:
        name: runtime-package
        path: .tmp/runtime-package/*.tgz
        if-no-files-found: error

  runtime-compatibility:
    needs: release-boundary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.0.0, 18.x, 20.x, 22.13.0, 22.x, 24.x]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - uses: actions/download-artifact@v8
      with:
        name: runtime-package
        path: .tmp/runtime-package
    - name: Verify the same tarball in a runtime-only consumer
      run: node scripts/verify-runtime-consumer.mjs .tmp/runtime-package/*.tgz
    - name: Verify public types with Node 18 declarations
      if: matrix.node-version == '24.x'
      run: node scripts/verify-runtime-consumer.mjs .tmp/runtime-package/*.tgz --types

